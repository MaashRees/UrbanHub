services:
  # 1. Stockage Data Lake S3 (MinIO / Silo)
  minio:
    image: docker.io/pgsty/silo:latest
    container_name: urbanhub-minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console d'administration Web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - ./data/minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # 2. Environnement de Développement Data (Jupyter Notebook)
  jupyter:
    build: .
    container_name: urbanhub-jupyter
    ports:
      - "8888:8888"   # Interface Jupyter Notebook
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
      - OPENAQ_API_KEY=${OPENAQ_API_KEY}
    volumes:
      - .:/app
    depends_on:
      - minio
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    restart: unless-stopped

  # 3. Service Dashboard Public (Voilà Standalone)
  dashboard:
    build: .
    container_name: urbanhub-dashboard
    ports:
      - "8866:8866"   # Dashboard interactif Voilà dédié
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
    volumes:
      - .:/app
    depends_on:
      - minio
    command: voila notebooks/05_dashboard.ipynb --port=8866 --no-browser --Voila.ip=0.0.0.0
    restart: unless-stopped
