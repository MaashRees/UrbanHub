services:
  # 1. Stockage Data Lake S3 (MinIO / Silo)
  minio:
    image: docker.io/pgsty/silo:latest
    container_name: urbanhub-minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console d'administration Web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - ./data/minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # 2. Environnement de Développement Data (Jupyter Notebook)
  jupyter:
    build: .
    container_name: urbanhub-jupyter
    ports:
      - "8888:8888"   # Interface Jupyter Notebook
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
      - OPENAQ_API_KEY=${OPENAQ_API_KEY}
    volumes:
      - .:/app
    depends_on:
      - minio
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    restart: unless-stopped

  # 3. Service Dashboard Public (Voilà Standalone)
  dashboard:
    build: .
    container_name: urbanhub-dashboard
    ports:
      - "8866:8866"   # Dashboard interactif Voilà dédié
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
    volumes:
      - .:/app
    depends_on:
      - minio
    # Chaque page ouverte démarre un noyau Python (environ 400 Mo). Sans limite, les noyaux des pages
    # fermées ou rechargées s'accumulent et saturent Docker : on les arrête après 10 minutes d'inactivité
    # et on plafonne la mémoire du service.
    mem_limit: 2g
    command: voila notebooks/05_dashboard.ipynb --port=8866 --no-browser --Voila.ip=0.0.0.0 --MappingKernelManager.cull_idle_timeout=600 --MappingKernelManager.cull_interval=60 --MappingKernelManager.cull_connected=True
    restart: unless-stopped

  # ==========================================================================
  # 4. Collecte en continu (profil "collect", non démarré par défaut)
  #    docker compose --profile collect up -d
  # Les trois services lisent le .env (clés R2) via env_file : ne pas y fixer
  # MINIO_ENDPOINT, sinon on écrirait dans le MinIO local. Une seule machine
  # doit faire tourner ces services : CityBikes limite le nombre d'appels.
  # ==========================================================================

  # Mobilité CityBikes : un cycle toutes les 5 minutes, Gold recalculé depuis R2
  collector-citybikes:
    build: .
    container_name: urbanhub-collector-citybikes
    profiles: ["collect"]
    env_file: .env
    volumes:
      - .:/app
    command: python scripts/citybikes_stream.py --interval-seconds 300
    restart: unless-stopped

  # Pollution OpenAQ : toutes les 2 h, fenêtre relue de 12 h, puis city_hourly reconstruit
  collector-openaq:
    build: .
    container_name: urbanhub-collector-openaq
    profiles: ["collect"]
    env_file: .env
    environment:
      - OPENAQ_LOOKBACK_HOURS=12
    volumes:
      - .:/app
    command: sh -c "while true; do python -m src.openaq_pipeline; sleep 7200; done"
    restart: unless-stopped

  # Météo Open-Meteo : actualisation toutes les heures des tables Gold météo
  collector-weather:
    build: .
    container_name: urbanhub-collector-weather
    profiles: ["collect"]
    env_file: .env
    volumes:
      - .:/app
    command: sh -c "while true; do python scripts/openmeteo_batch.py --upload; sleep 3600; done"
    restart: unless-stopped
